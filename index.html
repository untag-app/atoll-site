<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atoll</title>
<meta name="description" content="Atoll is an iOS app that uses NFC tags to help you spend less time on your phone.">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: #f7f7f5; color: #1c1c1e;
  }
  h1 { font-size: 3rem; margin: 0 0 12px; letter-spacing: -0.02em; }
  p { font-size: 1.15rem; line-height: 1.6; max-width: 32rem; margin: 0 0 8px; color: #555; }
  .soon { margin-top: 20px; font-size: .95rem; color: #888; }
  a { color: inherit; }
  footer { margin-top: 48px; font-size: .9rem; color: #888; }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #f2f2f2; }
    p { color: #bbb; }
  }
</style>
</head>
<body>
  <main>
    <h1>Atoll</h1>
    <p>An iOS app that uses NFC tags to help you spend less time on your phone.</p>
    <p class="soon">Coming soon to iOS.</p>
  </main>
  <footer>Contact: <a href="mailto:hello@tryatoll.app">hello@tryatoll.app</a></footer>
</body>
</html>
